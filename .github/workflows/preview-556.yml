# TEMPORARY — preview deploy สำหรับ branch 556 เท่านั้น (ลบก่อน merge)
name: Preview Deploy (556)
on:
  push:
    branches: ['claude/phase-556-multipay-repost-jv']
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=boonsook-pos-v5 --branch=claude-phase-556 --commit-dirty=true --commit-message="Preview 556"
