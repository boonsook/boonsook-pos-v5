# TEMPORARY — preview deploy สำหรับ branch audit นี้เท่านั้น (ลบก่อน merge เข้า main)
# เหตุผล: owner ไม่สะดวกกด workflow_dispatch เอง → deploy preview อัตโนมัติทุก push
# ปลอดภัยต่อ prod: wrangler pages deploy จาก branch ≠ production branch = preview เท่านั้น
name: Preview Deploy (audit branch)

on:
  push:
    branches: ['claude/app-audit-j9jpmv']

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Deploy preview to Cloudflare Pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=boonsook-pos-v5 --branch=claude-app-audit --commit-dirty=true --commit-message="Preview ${{ github.sha }}"
