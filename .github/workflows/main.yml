name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Pinned toolchain = the versions the allowlist build + Pages Functions build were
      # verified with (Node 24.14.0, Wrangler 4.168.0). Bump both together, re-verify.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"

      # Phase 647 pages allowlist: upload only the exact Git-tracked runtime files in
      # scripts/pages-allowlist.txt (no *.md / *.sql / scripts / tests / evidence).
      # build = copy byte-for-byte into a fresh dist-pages/ and verify; verify = re-check
      # the folder Wrangler will upload. Any failure stops the job before deploy.
      # Wrangler still runs from the repo root, so functions/ (+ _middleware.js) is
      # bundled as Pages Functions; dist-pages/ only holds static assets + _headers.
      - name: Build Pages output (allowlist)
        run: node scripts/build-pages-output.js build --out dist-pages --report "${{ runner.temp }}/pages-output-report.json"

      - name: Verify Pages output
        run: node scripts/build-pages-output.js verify --out dist-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.168.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-pages --project-name=boonsook-pos-v5 --commit-dirty=true --commit-message="Deploy ${{ github.sha }}"

  docker:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker build -t boonsook-pos:${{ github.sha }} .
          docker build -t boonsook-pos:latest .

      - name: Test Docker image
        run: |
          docker run -d --name test-pos -p 8080:80 boonsook-pos:latest
          sleep 3
          curl -f http://localhost:8080/ || exit 1
          docker stop test-pos
          docker rm test-pos
          echo "Docker image test passed!"
